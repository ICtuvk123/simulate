function draw(){let f=F[idx],filter=$('channel').value;ctx.clearRect(0,0,1000,1000);ctx.fillStyle='#fafcfd';ctx.fillRect(0,0,1000,1000);ctx.font='14px sans-serif';ctx.lineWidth=1;for(let v=-2000;v<=2000;v+=500){ctx.strokeStyle='#e7edf2';ctx.beginPath();ctx.moveTo(X(v),60);ctx.lineTo(X(v),940);ctx.moveTo(60,Y(v));ctx.lineTo(940,Y(v));ctx.stroke();ctx.fillStyle='#8ba0af';ctx.fillText(v+'',X(v)+4,518);if(v)ctx.fillText(v+'',507,Y(v)-5)}ctx.lineWidth=2;circle(0,0,1800,'#809bab');ctx.fillStyle='#566e80';ctx.fillText('目标区半径 1800 m',65,40);ctx.fillText('北 ↑',920,40);let cleared=new Set(F.slice(0,idx+1).filter(a=>a.result==='success').map(a=>a.ch));
if($('truth').checked)for(let s of D.sources){if(filter!=='all'&&+filter!==s.channel)continue;let color=cleared.has(s.channel)?'#7b9b8b':'#d15066';circle(s.x,s.y,15,color,true);ctx.fillStyle=color;ctx.fillText(s.channel+'',X(s.x)+7,Y(s.y)-7);if(s.direction_deg!==null&&s.direction_deg!==undefined){let a=s.direction_deg*Math.PI/180;ctx.beginPath();ctx.moveTo(X(s.x),Y(s.y));ctx.lineTo(X(s.x+150*Math.cos(a)),Y(s.y+150*Math.sin(a)));ctx.strokeStyle=color;ctx.stroke()}}
if($('regions').checked)for(let [ch,poly] of Object.entries(f.regions)){if(filter!=='all'&&filter!==ch)continue;if(!poly.length)continue;ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.closePath();ctx.fillStyle='#248bc427';ctx.strokeStyle='#248bc4';ctx.fill();ctx.stroke()}
ctx.beginPath();F.slice(0,idx+1).forEach((a,i)=>i?ctx.lineTo(X(a.point[0]),Y(a.point[1])):ctx.moveTo(X(a.point[0]),Y(a.point[1])));ctx.strokeStyle='#4a7e9c88';ctx.lineWidth=2;ctx.stroke();for(let a of F.slice(0,idx+1)){if(filter!=='all'&&+filter!==a.ch)continue;let color=a.result==='success'?'#1b986d':a.result==='direction'?'#237fc0':a.result==='no_target_in_range'?'#e4963b':'#a1aab1';circle(...a.point,a.result==='success'?15:7,color,true)}

function pause(){clearTimeout(timer);timer=null;$('play').textContent='播放'}function tick(){if(idx>=F.length-1){pause();return}idx++;draw();timer=setTimeout(tick,+$('speed').value)}$('play').onclick=()=>{if(timer)pause();else{if(idx===F.length-1)idx=0;$('play').textContent='暂停';timer=setTimeout(tick,10)}};$('prev').onclick=()=>{pause();idx=Math.max(0,idx-1);draw()};$('next').onclick=()=>{pause();idx=Math.min(F.length-1,idx+1);draw()};$('reset').onclick=()=>{pause();idx=0;draw()};$('timeline').oninput=e=>{pause();idx=+e.target.value;draw()};for(let id of ['channel','regions','truth'])$(id).onchange=draw;draw();</script></html>

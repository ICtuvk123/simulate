<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第四问 · 定位清除回放</title>
<style>
:root{color-scheme:light;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#1e3342;background:#eef3f7}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1450px;margin:auto}h1{font-size:24px;margin:0 0 8px}.muted{color:#617585;font-size:13px}header{margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:20px}.badge{padding:8px 12px;border-radius:12px;background:#dcece5;color:#18614a;font-size:13px}.layout{display:grid;grid-template-columns:minmax(460px,1fr) 330px;gap:18px}.card{background:white;border:1px solid #dce5ec;border-radius:16px;padding:18px;box-shadow:0 7px 22px #233e5810}canvas{width:100%;height:clamp(360px,calc(100vh - 245px),800px);object-fit:contain;display:block}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select{border:1px solid #c5d3de;background:#f7fafc;border-radius:8px;padding:8px 12px;color:#1e3342;cursor:pointer}button.primary{background:#146e92;color:white;border-color:#146e92}input[type=range]{width:100%;margin:14px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.stat{padding:12px;background:#f1f6f8;border-radius:10px}.stat strong{display:block;font-size:23px;line-height:1.5}.stat span{font-size:12px;color:#627686}.detail{font-size:14px;line-height:1.9;min-height:170px}.legend{font-size:12px;display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.sep{border-top:1px solid #e3ebef;margin:16px 0}label{font-size:13px;display:block;line-height:1.8}#channel{width:100%;margin-top:5px}.foot{font-size:12px;line-height:1.8;color:#627686}@media(max-width:850px){body{padding:12px}.layout{grid-template-columns:1fr}header{align-items:flex-start}.detail{min-height:0}}
</style><header><div><h1>第四问 · 定位清除回放</h1><div class="muted">自建本地模拟器 · 实际动作、实际反馈与逐项计时</div></div><div class="badge" id="badge"></div></header><main class="layout"><section class="card"><canvas id="map" width="1000" height="1000"></canvas><div class="legend"><span><i class="dot" style="background:#237fc0"></i>正测向</span><span><i class="dot" style="background:#a1aab1"></i>无信号</span><span><i class="dot" style="background:#1b986d"></i>清除成功</span><span><i class="dot" style="background:#e4963b"></i>光学失败</span></div><input id="timeline" type="range" min="0" value="0"><div class="controls"><button id="play" class="primary">播放</button><button id="prev">上一步</button><button id="next">下一步</button><button id="reset">回到起点</button><select id="speed"><option value="450">正常速度</option><option value="120">快速</option><option value="40">概览</option></select><span class="muted" id="step"></span></div></section><aside class="card"><div class="stats"><div class="stat"><span>已用虚拟时间 / 秒</span><strong id="time"></strong></div><div class="stat"><span>已成功清除 / 个</span><strong id="clear"></strong></div><div class="stat"><span>累计移动 / 千米</span><strong id="distance"></strong></div><div class="stat"><span>无线检测 / 次</span><strong id="rf"></strong></div></div><div id="detail" class="detail"></div><div class="sep"></div><label>显示频道<select id="channel"><option value="all">所有频道</option></select></label><label><input id="regions" type="checkbox" checked> 显示已观测的位置区域</label><label><input id="truth" type="checkbox"> 显示事后真值（仅用于回放）</label><div class="sep"></div><div class="foot">真值只在策略结束后交给评估器。勾选真值不会改变动作序列；该图不代表决策器能看到真实位置或发射朝向。<br><br>计时：移动距离 ÷ 5 + 无线检测 × 5 + 切频 + 光学次数 × 3 + 成功清除 × 2。<div id="summary"></div></div></aside></main>
<script>const D=__Q4_DATA__;
const F=D.frames,$=s=>document.getElementById(s),C=$('map'),ctx=C.getContext('2d');let idx=0,timer=null;const span=2100,k=440/span,X=x=>500+x*k,Y=y=>500-y*k;
const labels={'no_signal':'无信号','direction':'获得示向度','near':'近距离强信号','success':'清除成功','no_target_in_range':'光学范围内无目标','entered':'进入场景','user_exit':'按证书退出'};
const roles={search:'未知频道搜索',paired_probe:'双侧截线补测',guaranteed:'保证区域清除',near:'近距离清除',fallback:'有限光学后备',shared_bearing:'顺路共享测向',shared_in_place:'原地保证清除',optical_trial:'光学试探',lookahead_optical:'前瞻光学试探',replacement_search:'实际停靠替换搜索',compact_optical:'小区域光学覆盖',partial_optical:'局部光学试探',reused_negative:'历史负站补全探测',certificate_scan:'证书替代扫描',strip_optical:'凸块光学覆盖',selected_inplace_probe:'选中源原地补测',adaptive_single_probe:'单点探测后重规划'};
$('timeline').max=F.length-1;for(let i=1;i<=20;i++)$('channel').add(new Option('频道 '+i,i));$('badge').textContent=D.summary.all_success?'完整清除与合法退出已核验':'未通过完整任务核验';$('summary').textContent='本局最终：'+D.summary.total_time.toFixed(1)+' 秒；平均每源 '+D.summary.mean_time_per_source.toFixed(1)+' 秒；现实策略运行 '+D.summary.policy_wall_time_s.toFixed(2)+' 秒。';
function circle(x,y,r,color,fill=false){ctx.beginPath();ctx.arc(X(x),Y(y),r*k,0,2*Math.PI);ctx.strokeStyle=color;ctx.fillStyle=color;if(fill)ctx.fill();else ctx.stroke()}
function draw(){let f=F[idx],filter=$('channel').value;ctx.clearRect(0,0,1000,1000);ctx.fillStyle='#fafcfd';ctx.fillRect(0,0,1000,1000);ctx.font='14px sans-serif';ctx.lineWidth=1;for(let v=-2000;v<=2000;v+=500){ctx.strokeStyle='#e7edf2';ctx.beginPath();ctx.moveTo(X(v),60);ctx.lineTo(X(v),940);ctx.moveTo(60,Y(v));ctx.lineTo(940,Y(v));ctx.stroke();ctx.fillStyle='#8ba0af';ctx.fillText(v+'',X(v)+4,518);if(v)ctx.fillText(v+'',507,Y(v)-5)}ctx.lineWidth=2;circle(0,0,1800,'#809bab');ctx.fillStyle='#566e80';ctx.fillText('目标区半径 1800 m',65,40);ctx.fillText('北 ↑',920,40);let cleared=new Set(F.slice(0,idx+1).filter(a=>a.result==='success').map(a=>a.ch));
if($('truth').checked)for(let s of D.sources){if(filter!=='all'&&+filter!==s.channel)continue;let color=cleared.has(s.channel)?'#7b9b8b':'#d15066';circle(s.x,s.y,15,color,true);ctx.fillStyle=color;ctx.fillText(s.channel+'',X(s.x)+7,Y(s.y)-7);if(s.direction_deg!==null&&s.direction_deg!==undefined){let a=s.direction_deg*Math.PI/180;ctx.beginPath();ctx.moveTo(X(s.x),Y(s.y));ctx.lineTo(X(s.x+150*Math.cos(a)),Y(s.y+150*Math.sin(a)));ctx.strokeStyle=color;ctx.stroke()}}
if($('regions').checked)for(let [ch,poly] of Object.entries(f.regions)){if(filter!=='all'&&filter!==ch)continue;if(!poly.length)continue;ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.closePath();ctx.fillStyle='#248bc427';ctx.strokeStyle='#248bc4';ctx.fill();ctx.stroke()}
ctx.beginPath();F.slice(0,idx+1).forEach((a,i)=>i?ctx.lineTo(X(a.point[0]),Y(a.point[1])):ctx.moveTo(X(a.point[0]),Y(a.point[1])));ctx.strokeStyle='#4a7e9c88';ctx.lineWidth=2;ctx.stroke();for(let a of F.slice(0,idx+1)){if(filter!=='all'&&+filter!==a.ch)continue;let color=a.result==='success'?'#1b986d':a.result==='direction'?'#237fc0':a.result==='no_target_in_range'?'#e4963b':'#a1aab1';circle(...a.point,a.result==='success'?15:7,color,true)}
if(f.bearing!==null&&f.bearing!==undefined){let a=f.bearing*Math.PI/180;ctx.beginPath();ctx.moveTo(X(f.point[0]),Y(f.point[1]));ctx.lineTo(X(f.point[0]+1500*Math.cos(a)),Y(f.point[1]+1500*Math.sin(a)));ctx.strokeStyle='#237fc0';ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([])}circle(...f.point,25,'#152f42',true);circle(...f.point,40,'#152f42');$('time').textContent=f.time.toFixed(1);$('clear').textContent=f.success;$('distance').textContent=(f.distance/1000).toFixed(2);$('rf').textContent=f.rf;$('step').textContent=(idx+1)+' / '+F.length;$('timeline').value=idx;$('detail').innerHTML='<b>'+(labels[f.result]||f.result)+'</b><br>动作：'+f.path+(f.ch?' · 频道 '+f.ch:'')+'<br>用途：'+(roles[f.role]||'场景管理')+'<br>位置：('+f.point.map(v=>v.toFixed(1)).join(', ')+') m<br>切频 '+f.switch+' 次 · 光学 '+f.optical+' 次'+(f.bearing!==null&&f.bearing!==undefined?'<br>示向度：'+f.bearing.toFixed(2)+'°':'');}
function pause(){clearTimeout(timer);timer=null;$('play').textContent='播放'}function tick(){if(idx>=F.length-1){pause();return}idx++;draw();timer=setTimeout(tick,+$('speed').value)}$('play').onclick=()=>{if(timer)pause();else{if(idx===F.length-1)idx=0;$('play').textContent='暂停';timer=setTimeout(tick,10)}};$('prev').onclick=()=>{pause();idx=Math.max(0,idx-1);draw()};$('next').onclick=()=>{pause();idx=Math.min(F.length-1,idx+1);draw()};$('reset').onclick=()=>{pause();idx=0;draw()};$('timeline').oninput=e=>{pause();idx=+e.target.value;draw()};for(let id of ['channel','regions','truth'])$(id).onchange=draw;draw();</script></html>
